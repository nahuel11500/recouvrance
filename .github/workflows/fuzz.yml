# Fuzzing with ClusterFuzzLite (cargo-fuzz targets in fuzz/): the table filter, Kubernetes
# quantities and YAML. On a PR, the fuzzers its changes reach run for 5 minutes; every week, all
# of them run for 30. A crash fails the run with the input that caused it.
name: Fuzzing

on:
  pull_request:
    paths: ["src/**", "fuzz/**", ".clusterfuzzlite/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: Fuzz (${{ github.event_name == 'pull_request' && 'changes' || 'all' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main, 2026-02-12 (no releases)
        with:
          language: rust
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main, 2026-02-12 (no releases)
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 1800 }}

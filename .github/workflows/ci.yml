name: CI

# Pull requests get the quick checks (a few minutes). Pushes to main, release tags and
# manual runs get everything: macOS, the minimum Rust version, docs, an end-to-end run on
# a kind cluster and release builds.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  # Libraries gpui needs to build and run on Linux.
  LINUX_DEPS: >-
    pkg-config clang cmake libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
  FULL: ${{ github.event_name != 'pull_request' }}
  # When many jobs start at once the Ubuntu mirror can stall for minutes: time out and retry.
  APT_GET: sudo apt-get -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

jobs:
  # ---- Quick checks (every pull request and push) ----

  # Format, spelling, licenses and advisories share one runner: on a busy day every job waits
  # for a free runner, so fewer jobs per PR means less waiting.
  quick:
    name: Format, spelling and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  check:
    name: Clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --locked --profile ci --all-targets --features dev -- -D warnings
      - name: Clippy without developer tools
        run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --profile ci --features dev

  # ---- Full run (main, tags, manual) ----

  test-macos:
    name: Tests (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
      - run: cargo test --locked --profile ci --features dev

  msrv:
    name: Minimum Rust version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
      - run: cargo check --locked --profile ci

  docs:
    name: Docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
      - run: cargo doc --locked --profile ci --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  e2e:
    name: End to end (kind)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: recouvrance
      - name: Load test objects
        run: |
          kubectl create deployment web --image=busybox:1.37 -- sh -c 'while true; do echo hello ERROR $(date); sleep 2; done'
          kubectl rollout status deployment/web --timeout=120s
      - run: cargo build --locked --profile ci --features dev
      - name: Smoke checks (discovery, table watch, list timing)
        run: |
          RECOUVRANCE_SMOKE=kind-recouvrance target/ci/recouvrance | tee smoke.txt
          grep -q "^kinds=" smoke.txt
          grep -q "^rows=" smoke.txt
          RECOUVRANCE_SMOKE=kind-recouvrance RECOUVRANCE_LISTTIME=1 target/ci/recouvrance
      - name: Render the UI off-screen
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          RECOUVRANCE_CONTEXT: kind-recouvrance
          RECOUVRANCE_KIND: pods
          RECOUVRANCE_NS: default
          RECOUVRANCE_SELECT: "0"
          RECOUVRANCE_TAB: logs
        run: timeout 300 target/ci/recouvrance --snapshot snapshot.png 10 && test -s snapshot.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snapshot
          path: snapshot.png
          if-no-files-found: ignore

  build:
    name: Release build (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    needs: [quick, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-built on Apple Silicon, like the release.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recouvrance-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/recouvrance

  # One required check for branch protection, whatever ran.
  ci-ok:
    name: CI result
    if: always()
    needs: [quick, check, test-macos, msrv, docs, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

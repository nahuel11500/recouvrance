name: CI

# Pull requests get the quick checks and the end-to-end run on a kind cluster (the write
# guards). Pushes to main, release tags and manual runs get everything: macOS, Windows, the
# minimum Rust version, docs and release builds.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  # Libraries gpui needs to build and run on Linux.
  LINUX_DEPS: >-
    pkg-config clang cmake libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
  FULL: ${{ github.event_name != 'pull_request' }}
  # When many jobs start at once the Ubuntu mirror can stall for minutes: time out and retry.
  APT_GET: sudo apt-get -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20

jobs:
  # ---- Quick checks (every pull request and push) ----

  # Format, spelling, licenses and advisories share one runner: on a busy day every job waits
  # for a free runner, so fewer jobs per PR means less waiting.
  quick:
    name: Format, spelling and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  check:
    name: Clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --locked --profile ci --all-targets --features dev -- -D warnings
      - name: Clippy without developer tools
        run: cargo clippy --locked --profile ci --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --profile ci --features dev

  # Windows on every pull request, compiled only (tests and all targets, no linking): code
  # that builds on Unix alone shows here rather than on main. Its own cache, also saved by
  # main, so a pull request starts warm.
  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
      - run: cargo check --locked --profile ci --all-targets --features dev

  # ---- Full run (main, tags, manual) ----

  test-macos:
    name: Tests (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - run: cargo test --locked --profile ci --features dev

  test-windows:
    name: Tests (Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - run: cargo test --locked --profile ci --features dev

  msrv:
    name: Minimum Rust version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
      - run: cargo check --locked --profile ci

  docs:
    name: Docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - run: cargo doc --locked --profile ci --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  e2e:
    name: End to end (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: recouvrance
      - name: Load test objects
        run: |
          kubectl create deployment web --image=busybox:1.37 -- sh -c 'while true; do echo hello ERROR $(date); sleep 2; done'
          kubectl rollout status deployment/web --timeout=120s
      - run: cargo build --locked --profile ci --features dev
      - name: Smoke checks (discovery, table watch, list timing)
        run: |
          RECOUVRANCE_SMOKE=kind-recouvrance target/ci/recouvrance | tee smoke.txt
          grep -q "^kinds=" smoke.txt
          grep -q "^rows=" smoke.txt
          RECOUVRANCE_SMOKE=kind-recouvrance RECOUVRANCE_LISTTIME=1 target/ci/recouvrance
          # The Workloads overview's lean requests (cells alone, lists from the cache), as a real
          # API server answers them. kind has no metrics-server: only usage may fail.
          RECOUVRANCE_SMOKE=kind-recouvrance RECOUVRANCE_DASH=1 target/ci/recouvrance | tee dash.txt
          grep -qE "Deployments: [0-9]+ Running" dash.txt
          grep -qE "Pods: [0-9]+ Running" dash.txt
          grep -q "warnings: " dash.txt
          if grep -E ": (failed: |forbidden)|(warnings|pods) failed" dash.txt; then exit 1; fi
      - name: Write guards (write mode, agent rules, kill switch during a drain)
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/guards-config
          XDG_DATA_HOME: ${{ runner.temp }}/guards-data
          RECOUVRANCE_E2E_CONTEXT: kind-recouvrance
        run: cargo test --locked --profile ci --features dev -- --ignored --test-threads 1 "e2e::"
      - name: Render the UI off-screen
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          RECOUVRANCE_CONTEXT: kind-recouvrance
          RECOUVRANCE_KIND: pods
          RECOUVRANCE_NS: default
          RECOUVRANCE_SELECT: "0"
          RECOUVRANCE_TAB: logs
        run: timeout 300 target/ci/recouvrance --snapshot snapshot.png 10 && test -s snapshot.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snapshot
          path: snapshot.png
          if-no-files-found: ignore

  # The Windows app end to end, as far as a runner goes (#1039): nobody has a Windows machine.
  # On a kwok cluster (Windows programs: the runner has no Linux containers for kind), the app's
  # own build answers its command line, serves MCP, opens its window, runs a kubeconfig login
  # command without a console window and keeps its files in %LOCALAPPDATA%\recouvrance; the dev
  # build drives the UI headless and runs a plugin through Git for Windows' sh. The steps are in
  # scripts/ci/windows-e2e.
  e2e-windows:
    name: End to end (Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      # The MCP port of every Recouvrance started here.
      PORT: 47199
      KWOK_VERSION: v0.8.0
      KWOKCTL_SHA256: 13a5b782aaa2c8413dca8903b1e3deaeacfa5da1da66cd565a1842ecf010bf09
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      - name: Build the app and the dev build
        run: scripts/ci/windows-e2e/build.ps1
      - name: Start a kwok cluster, with a context that has a login command
        run: scripts/ci/windows-e2e/cluster.ps1
      - name: Command line (--version, --help, agent-create)
        env:
          LOCALAPPDATA: ${{ runner.temp }}\e2e\local
          APPDATA: ${{ runner.temp }}\e2e\roaming
        run: scripts/ci/windows-e2e/cli.ps1
      - name: MCP server without a window (serve)
        env:
          LOCALAPPDATA: ${{ runner.temp }}\e2e\local
          APPDATA: ${{ runner.temp }}\e2e\roaming
        run: scripts/ci/windows-e2e/serve.ps1
      - name: The app started from Explorer (window, MCP server, a login command, its files)
        run: scripts/ci/windows-e2e/window.ps1
      - name: Developer tools (smoke checks, headless UI, a plugin through sh)
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}\e2e\dev-config
          XDG_DATA_HOME: ${{ runner.temp }}\e2e\dev-data
          # Where exports go (~\Downloads).
          HOME: ${{ runner.temp }}\e2e\home
        run: scripts/ci/windows-e2e/dev.ps1
      - name: Stop the kwok cluster
        if: always()
        run: if ($env:KWOKCTL) { & $env:KWOKCTL delete cluster --name recouvrance }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-windows
          path: |
            ${{ runner.temp }}/e2e/*.png
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
            ${{ runner.temp }}/e2e/plugin.txt
          if-no-files-found: ignore

  build:
    name: Release build (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    needs: [quick, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-built on Apple Silicon, like the release.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: $APT_GET update && $APT_GET install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recouvrance-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/recouvrance${{ runner.os == 'Windows' && '.exe' || '' }}

  # One required check for branch protection, whatever ran.
  ci-ok:
    name: CI result
    if: always()
    # Not "End to end (Windows)" yet: it doesn't pass whole (#1039).
    needs: [quick, check, check-windows, test-macos, test-windows, msrv, docs, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

# CodeQL: static analysis of the Rust code on every PR and push to main and weekly; the
# workflows are analyzed in codeql-actions.yml. Findings show in the Security tab.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    env:
      # Keep the extractor's cargo output (build scripts, proc macros) in target/, which the
      # cache below saves, instead of a new scratch directory on every run.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ github.workspace }}/target
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Most of the extraction time is loading the cargo workspace: fetching every crate and
      # running build scripts and proc macros. Reuse main's copy instead of starting cold; only
      # main saves it, so a burst of PRs doesn't fill the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: codeql-target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust

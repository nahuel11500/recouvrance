name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: [Cargo.lock, deny.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories

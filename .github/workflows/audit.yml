name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: [Cargo.lock, deny.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

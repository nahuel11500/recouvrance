# A .deb and an AppImage for x86_64 Linux, built by the release workflow (dist's
# local-artifacts-jobs) and uploaded to the GitHub release with the tarballs. The release
# workflow grants this job id-token and attestations (dist's github-custom-job-permissions)
# so both packages get a build provenance attestation.
name: Linux packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    pkg-config clang cmake libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
  # Both pinned by checksum: appimagetool would otherwise fetch the runtime from the mutable
  # "continuous" release. To update, download the new assets and replace URL and sha256.
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  packages:
    name: .deb and AppImage
    # The oldest supported runner, so the binary runs on older glibc.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-01
        with:
          toolchain: stable
      - run: cargo build --locked --release
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - name: .deb
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cargo deb --no-build --output "recouvrance_${version}_amd64.deb"
      - name: AppImage
        run: |
          app=Recouvrance.AppDir
          install -Dm755 target/release/recouvrance "$app/usr/bin/recouvrance"
          install -Dm644 assets/recouvrance.desktop "$app/recouvrance.desktop"
          install -Dm644 assets/recouvrance.svg "$app/recouvrance.svg"
          install -Dm644 assets/recouvrance.svg "$app/usr/share/icons/hicolor/scalable/apps/recouvrance.svg"
          for size in 16x16 24x24; do
            install -Dm644 assets/recouvrance-small.svg "$app/usr/share/icons/hicolor/$size/apps/recouvrance.svg"
          done
          ln -s usr/bin/recouvrance "$app/AppRun"
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o appimage-runtime "$APPIMAGE_RUNTIME_URL"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool "$APPIMAGE_RUNTIME_SHA256" appimage-runtime | sha256sum -c -
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --runtime-file appimage-runtime "$app" recouvrance-x86_64.AppImage
      - name: Checksums
        run: for f in recouvrance_*.deb recouvrance-x86_64.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            recouvrance_*.deb
            recouvrance-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # dist uploads every artifacts-* to the release.
          name: artifacts-linux-packages
          path: |
            recouvrance_*.deb*
            recouvrance-x86_64.AppImage*

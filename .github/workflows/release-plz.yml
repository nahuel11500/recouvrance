# Release pull request and publishing; see release-plz.toml. Off until the repository variable
# RELEASES_ENABLED is "true". Both jobs run in the `release` environment (deployment branch rule:
# main only), which holds the secrets, so no other workflow or branch can read them:
# - RELEASE_PLZ_TOKEN: a fine-grained token (contents and pull requests: write) so the tag starts
#   the release workflow and the release pull request gets CI (GITHUB_TOKEN events start nothing);
# - CARGO_REGISTRY_TOKEN (first release only): a crates.io token with publish-new and
#   publish-update scopes. Once the crate exists, configure trusted publishing on crates.io and
#   delete this secret: release-plz then gets a short-lived token through OIDC (id-token: write).
# See docs/development.md, "Releases".
name: Release-plz

# The release pull request is opened or brought up to date every two hours, and when the workflow is
# run by hand (Actions → Release-plz → Run workflow): updated on every push to `main`, it ran CI and
# CodeQL again each time. Publishing still runs on pushes to `main`, so merging the pull request
# releases.
on:
  push:
    branches: [main]
  schedule:
    # Off the hour, when GitHub's scheduler is less busy.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    pkg-config clang cmake libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
    libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev

jobs:
  release:
    name: Publish
    if: vars.RELEASES_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # crates.io trusted publishing.
      id-token: write
    concurrency:
      group: release-plz-release
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      # release-plz pushes the tag and the release through the GitHub API, so no git credentials
      # are left on disk for the build scripts cargo publish runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cargo publish builds the crate to verify it.
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-01
        with:
          toolchain: stable
      # First publish: the crate does not exist yet, so trusted publishing cannot work; a token
      # with publish-new scope is needed.
      - name: Publish (registry token)
        if: env.HAS_CARGO_TOKEN == 'true'
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Every later publish: no token, release-plz uses crates.io trusted publishing.
      - name: Publish (trusted publishing)
        if: env.HAS_CARGO_TOKEN != 'true'
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  pull-request:
    name: Release pull request
    if: vars.RELEASES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      # release-plz commits and pushes the release branch through the GitHub API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-01
        with:
          toolchain: stable
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

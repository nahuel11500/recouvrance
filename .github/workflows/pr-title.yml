# Pull requests are squash-merged, so the title becomes the commit on main; release-plz reads it
# to pick the next version and write the changelog.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

  # A fix comes with a test that fails without it: fixes made without one came back in
  # later audit rounds. The label "no test needed" skips it (docs, CI, a typo).
  regression-test:
    name: Fix has a test
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, 'fix')
    steps:
      - name: Look for a new test in the changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if jq -e 'index("no test needed")' <<<"$LABELS" >/dev/null; then
            echo "Labelled \"no test needed\"."
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files")
          code=$(jq -s '[.[][] | select(.filename | test("^(src|fuzz)/.*\\.rs$"))] | length' <<<"$files")
          tests=$(jq -rs '.[][] | select(.filename | test("\\.rs$")) | .patch // ""' <<<"$files" \
            | grep -cE '^\+.*(#\[(gpui::)?test\]|proptest!)' || true)
          echo "Rust files changed: $code, tests added: $tests"
          if [ "$code" -gt 0 ] && [ "$tests" -eq 0 ]; then
            echo "::error::A fix needs a test that fails without it (or the label \"no test needed\")."
            exit 1
          fi

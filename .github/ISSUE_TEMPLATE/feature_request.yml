name: Feature request
description: An idea for Recouvrance
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Mockups or examples from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

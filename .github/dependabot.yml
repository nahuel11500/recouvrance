# Pull request titles become "build(deps): …", which passes the conventional title check and
# does not bump the version (see release_commits in release-plz.toml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # New versions wait two weeks, so a compromised release is usually caught before it lands here.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New versions wait two weeks, so a compromised release is usually caught before it lands here.
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    # Generated by dist: an edit there fails dist's "is release.yml up to date" check. Its
    # actions move with `dist selfupdate` / `dist generate` instead.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]

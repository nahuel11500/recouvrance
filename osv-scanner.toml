# Advisories OSV-Scanner (and so OpenSSF Scorecard) should not count, with why. All of them are
# "unmaintained" notices, not vulnerabilities, for crates we do not depend on directly and cannot
# replace ourselves; deny.toml tracks the same list. Each expires, so it gets looked at again: on
# that date it counts again unless renewed with a reason. A real vulnerability in one of these
# crates has its own advisory ID, which this file does not hide.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0384"
ignoreUntil = 2027-04-21
reason = "instant is unmaintained (not a vulnerability); pulled in by gpui-base (the UI toolkit), waiting on upstream"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-04-21
reason = "paste is unmaintained (not a vulnerability); a build-time macro pulled in by gpui-component and the image decoders, waiting on upstream"


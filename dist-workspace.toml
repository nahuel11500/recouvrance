[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
install-updater = true
# release-plz creates the tag and the GitHub release notes; dist builds and uploads the binaries.
create-release = false
# The .deb and AppImage, built next to the tarballs and uploaded with them.
local-artifacts-jobs = ["./linux-packages"]
include = ["assets/recouvrance.svg", "assets/recouvrance.desktop"]
pr-run-mode = "skip"
# Build provenance attestations for the archives (linux-packages.yml attests the .deb and the
# AppImage); verify with `gh attestation verify <file> --repo nahuel11500/recouvrance`.
github-attestations = true
# release.yml calls linux-packages.yml with `secrets: inherit` (hard-coded by dist). That passes
# repository secrets only: the release secrets live in the `release` environment, which no job of
# the release workflow enters, so the packages job cannot read them. Keep it that way.

# Actions pinned to commits, so a moved tag can't change what the release runs. Update them
# here (dependabot skips release.yml), then `dist generate --mode ci`.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2

# The packages job attests what it builds.
[dist.github-custom-job-permissions]
"linux-packages" = { contents = "read", id-token = "write", attestations = "write" }

[dist.dependencies.apt]
pkg-config = "*"
clang = "*"
cmake = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libvulkan-dev = "*"
libx11-xcb-dev = "*"
libxcb1-dev = "*"

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
# Intel Macs are cross-built on Apple Silicon: the Intel runners take three times as long.
x86_64-apple-darwin = { runner = "macos-15", host = "aarch64-apple-darwin" }

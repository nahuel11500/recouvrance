# cargo-deny: licenses, security advisories, banned and unknown sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in the dependency tree (GUI and YAML stacks) are not actionable here;
# direct dependencies are still checked. Known and tracked (see them with unmaintained = "all"):
# - unsafe-libyaml (RUSTSEC-2024-0449), through serde_yaml_ng: the one in our own YAML path;
#   replace it when serde_yaml_ng moves to a maintained parser or a successor appears;
# - instant, paste, rustls-pemfile, rustybuzz, ttf-parser, zbus_names, zvariant,
#   zvariant_derive: deep in the GUI toolkit and platform stacks, waiting on upstream.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

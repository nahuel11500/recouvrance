# cargo-deny: licenses, security advisories, banned and unknown sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in the dependency tree (the GUI stack) are not actionable here;
# direct dependencies are still checked. Known and tracked (see them with unmaintained = "all"):
# Also listed, with reasons and an expiry, in osv-scanner.toml (for OSV-Scanner and Scorecard):
# - instant, paste, rustls-pemfile, rustybuzz, ttf-parser, zbus_names, zvariant,
#   zvariant_derive: deep in the GUI toolkit and platform stacks, waiting on upstream.
# - chrono (https://rustsec.org/advisories/RUSTSEC-2026-0543): unmaintained, not a
#   vulnerability; we use jiff, chrono comes in through gpui, rmcp and schemars.
unmaintained = "workspace"
# RUSTSEC-2026-0600 (kube-client): only the `openssl-tls` connector is affected; kube is built
# with `rustls-tls` alone and no openssl crate is in Cargo.lock. Until kube 5.2.0 is taken
# (released 2026-11-24, after the 3-day wait for new releases).
ignore = [{ id = "RUSTSEC-2026-0600", reason = "openssl-tls connector only; we build kube with rustls-tls" }]
# Unsound code is checked in every crate, not only direct dependencies (the default): OSV and
# Scorecard count it wherever it is, and a fixed version is usually a lockfile update away.
unsound = "all"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
